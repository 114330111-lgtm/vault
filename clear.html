<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>清快取…</title>
<style>body{font-family:system-ui;background:#0f172a;color:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:40px}
.spinner{width:40px;height:40px;border:3px solid #60a5fa;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 20px}
@keyframes s{to{transform:rotate(360deg)}}
.log{font-size:13px;color:#94a3b8;font-family:ui-monospace,monospace;text-align:left;background:#1e293b;padding:12px;border-radius:8px;margin-top:16px;max-width:400px;white-space:pre-wrap}
.ok{color:#4ade80}.err{color:#f87171}</style></head>
<body><div class="box">
<div class="spinner"></div>
<h2>清除舊快取中…</h2>
<div class="log" id="log"></div>
</div>
<script>
const log = document.getElementById('log');
function add(msg, cls=''){ log.innerHTML += `<div class="${cls}">${msg}</div>`; }

(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      add(`找到 ${regs.length} 個 service worker`);
      for (const r of regs) {
        await r.unregister();
        add(`✓ unregister: ${r.scope}`, 'ok');
      }
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      add(`找到 ${keys.length} 個 cache`);
      for (const k of keys) {
        await caches.delete(k);
        add(`✓ delete: ${k}`, 'ok');
      }
    }
    add('✓ 全部清完，2 秒後跳回 vault…', 'ok');
    setTimeout(() => location.replace('./vault.html'), 2000);
  } catch (e) {
    add('✗ ' + e.message, 'err');
  }
})();
</script></body></html>
